!
no enable password
no aaa root
!
username arista privilege 15 role network-admin secret sha512 $6$arista$MGIGSLYQwHBYFzWAj0hfvqsA/RizNUC/HHH1aYYu0ly3dVTq9ccjWHAGTmFqolIga6SnZrXfVk97JioAziWqB0
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.0.5:9910 -cvauth=token,/tmp/token -cvvrf=default -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs -cvsourceintf=Management0
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname member-leaf-3d
ip domain lookup source-interface Management0
ip name-server vrf default 192.168.0.1
dns domain atd.lab
!
spanning-tree mode mstp
spanning-tree mst 0 priority 32768
!
vlan 310
   name IDF3_DATA
!
vlan 320
   name IDF3_VOICE
!
aaa authorization exec default local
!
interface Port-Channel49
   description L2_IDF3_Port-Channel52
   no shutdown
   switchport trunk allowed vlan 310,320
   switchport mode trunk
   switchport
!
interface Ethernet1
   description host-5_Ethernet1
   no shutdown
   switchport access vlan 320
   switchport mode access
   switchport
   spanning-tree portfast
!
interface Ethernet49
   description L2_leaf-3a_Ethernet52
   no shutdown
   channel-group 49 mode active
!
interface Ethernet50
   description L2_leaf-3b_Ethernet52
   no shutdown
   channel-group 49 mode active
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.20/24
!
ip route 0.0.0.0/0 192.168.0.1
!
ntp local-interface Management0
ntp server 192.168.0.1 prefer iburst
!
end
